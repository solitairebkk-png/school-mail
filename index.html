<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学校メール">
<title>学校メール</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1f2430; --sub: #6b7280;
    --line: #e5e2d9; --accent: #1f5fae; --accent-bg: #e8f0fb;
    --done: #2f7d4f; --done-bg: #e6f4ec; --warn: #b4540a; --warn-bg: #fdf0e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --card: #1d2027; --text: #eceef3; --sub: #9aa1ae;
      --line: #2e323c; --accent: #7db0f0; --accent-bg: #1e2c42;
      --done: #6fcf97; --done-bg: #1b2e24; --warn: #f2a65a; --warn-bg: #3a2a18;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7; -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--sub); }
  .who button {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 6px 14px; font-size: 14px; min-height: 36px;
  }
  .who button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { padding: 12px 16px calc(env(safe-area-inset-bottom) + 40px); max-width: 720px; margin: 0 auto; }
  .tabs { display: flex; gap: 8px; margin: 4px 0 12px; }
  .tabs button {
    flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px; font-size: 14px; min-height: 40px;
  }
  .tabs button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card.unread { border-left: 5px solid var(--accent); }
  .meta { font-size: 12px; color: var(--sub); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .subj { font-size: 16px; font-weight: 700; margin: 6px 0 2px; word-break: break-word; }
  .subj-orig { font-size: 12px; color: var(--sub); word-break: break-word; }
  .badges { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  .badge { font-size: 12px; border-radius: 999px; padding: 3px 10px; background: var(--line); color: var(--sub); }
  .badge.done { background: var(--done-bg); color: var(--done); }
  .body { white-space: pre-wrap; word-break: break-word; font-size: 15px; margin-top: 10px; }
  .body.orig { color: var(--sub); font-size: 14px; }
  .clip { max-height: 9.5em; overflow: hidden; position: relative; }
  .clip::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3em;
    background: linear-gradient(transparent, var(--card));
  }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .row button {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 14px; font-size: 14px; min-height: 40px;
  }
  .row button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row button.readbtn.done { background: var(--done-bg); border-color: var(--done); color: var(--done); }
  .hl { background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 0 3px; font-weight: 600; }
  .msg { text-align: center; color: var(--sub); padding: 40px 12px; }
  .err { color: var(--warn); }
  .small { font-size: 12px; color: var(--sub); text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<header>
  <h1>🏫 学校メール(日本語訳)</h1>
  <div class="who" id="who">
    <span>見ている人:</span>
    <button data-who="papa">お父さん</button>
    <button data-who="mama">お母さん</button>
    <button data-who="kid">ゆたか</button>
  </div>
</header>
<main>
  <div class="tabs">
    <button id="tabAll" class="on">すべて</button>
    <button id="tabUnread">自分が未読</button>
  </div>
  <div id="list"><div class="msg">読み込み中…</div></div>
  <div class="small">更新: <span id="updated">-</span>　<a href="#" id="reload" style="color:var(--accent)">再読み込み</a></div>
</main>

<script>
(function () {
  var SUPABASE_URL = "https://kzacpqrpnoxqtbcstswp.supabase.co";
  var SUPABASE_KEY = "sb_publishable_X-40StOgx5Q6Gl9k6JRCHw_6w4m3d03";
  var NAMES = { papa: "お父さん", mama: "お母さん", kid: "ゆたか" };
  var ORDER = ["papa", "mama", "kid"];

  var token = "";
  var me = "";
  var mails = [];
  var onlyUnread = false;
  var showOrig = {};   // id -> bool
  var expanded = {};   // id -> bool

  function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // トークンはURLの # 以降(サーバーに送られない部分)から取得して端末に記憶する
  (function initToken() {
    var m = location.hash.match(/t=([A-Za-z0-9]+)/);
    if (m) {
      token = m[1];
      lsSet("school_token", token);
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    } else {
      token = lsGet("school_token");
    }
    me = lsGet("school_me");
  })();

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // 日付・時間・締切っぽい言葉を目立たせる(翻訳後の日本語向け)
  function highlight(text) {
    var h = esc(text);
    var re = /(\d{1,2}月\d{1,2}日[^\s、。]{0,6}|\d{4}年\d{1,2}月\d{1,2}日|締め切り|締切|期限|持ち物|持参|必要です|提出|必ず|ご注意|中止|延期|キャンセル|休校|休み)/g;
    return h.replace(re, '<span class="hl">$1</span>');
  }

  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var w = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
    return (d.getMonth() + 1) + "月" + d.getDate() + "日(" + w + ") " +
      ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  function senderName(s) {
    if (!s) return "";
    var m = s.match(/^\s*"?([^"<]+?)"?\s*</);
    return (m ? m[1] : s).trim();
  }

  function rpc(name, payload) {
    return fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      var ct = r.headers.get("content-type") || "";
      return ct.indexOf("json") >= 0 ? r.json() : null;
    });
  }

  function load() {
    var list = document.getElementById("list");
    if (!token) {
      list.innerHTML = '<div class="msg err">このページは、家族用のURL(最後に #t=… が付いたもの)から開いてください。</div>';
      return;
    }
    rpc("school_list_mails", { p_token: token, p_limit: 100 }).then(function (rows) {
      mails = rows || [];
      document.getElementById("updated").textContent = fmtDate(new Date().toISOString());
      render();
    }).catch(function (e) {
      list.innerHTML = '<div class="msg err">読み込めませんでした(' + esc(e.message) + ')。通信を確認して、再読み込みしてください。</div>';
    });
  }

  function isReadBy(m, who) {
    return !!(m.read_by && m.read_by[who]);
  }

  function render() {
    // 見ている人ボタン
    document.querySelectorAll("#who button").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-who") === me);
    });
    document.getElementById("tabAll").classList.toggle("on", !onlyUnread);
    document.getElementById("tabUnread").classList.toggle("on", onlyUnread);

    var rows = mails.filter(function (m) {
      return !(onlyUnread && me && isReadBy(m, me));
    });

    var list = document.getElementById("list");
    if (!rows.length) {
      list.innerHTML = '<div class="msg">' + (mails.length ? "未読のメールはありません 🎉" : "まだメールがありません。学校のメールが届くと、ここに表示されます。") + "</div>";
      return;
    }

    list.innerHTML = rows.map(function (m) {
      var unread = me && !isReadBy(m, me);
      var orig = !!showOrig[m.id];
      var open = !!expanded[m.id];
      var subjJa = m.subject_ja || m.subject || "(件名なし)";
      var subjOrig = (m.subject_ja && m.subject && m.subject_ja !== m.subject) ? m.subject : "";
      var bodyText = orig ? (m.body_original || "") : (m.body_ja || m.body_original || "");
      var badges = ORDER.map(function (w) {
        var d = isReadBy(m, w);
        return '<span class="badge' + (d ? " done" : "") + '">' + NAMES[w] + (d ? " 既読" : " 未読") + "</span>";
      }).join("");
      var iRead = me && isReadBy(m, me);
      return '<div class="card' + (unread ? " unread" : "") + '" data-id="' + m.id + '">' +
        '<div class="meta"><span>' + esc(senderName(m.sender)) + '</span><span>' + esc(fmtDate(m.received_at)) + "</span></div>" +
        '<div class="subj">' + esc(subjJa) + "</div>" +
        (subjOrig ? '<div class="subj-orig">' + esc(subjOrig) + "</div>" : "") +
        '<div class="badges">' + badges + "</div>" +
        '<div class="body' + (orig ? " orig" : "") + (open ? "" : " clip") + '">' + (orig ? esc(bodyText) : highlight(bodyText)) + "</div>" +
        '<div class="row">' +
          '<button class="primary" data-act="toggle">' + (open ? "閉じる" : "全文を読む") + "</button>" +
          '<button data-act="orig">' + (orig ? "日本語に戻す" : "原文(英語)を見る") + "</button>" +
          '<button class="readbtn' + (iRead ? " done" : "") + '" data-act="read">' + (iRead ? "✓ 既読にしました" : "既読にする") + "</button>" +
        "</div></div>";
    }).join("");
  }

  document.getElementById("list").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    var card = btn.closest(".card");
    var id = Number(card.getAttribute("data-id"));
    var act = btn.getAttribute("data-act");
    if (act === "toggle") { expanded[id] = !expanded[id]; render(); }
    else if (act === "orig") { showOrig[id] = !showOrig[id]; expanded[id] = true; render(); }
    else if (act === "read") {
      if (!me) { alert("先に、上の「見ている人」を選んでください。"); return; }
      rpc("school_mark_read", { p_token: token, p_id: id, p_who: me }).then(function () {
        var m = mails.filter(function (x) { return x.id === id; })[0];
        if (m) { m.read_by = m.read_by || {}; m.read_by[me] = new Date().toISOString(); }
        render();
      }).catch(function () { alert("既読にできませんでした。もう一度試してください。"); });
    }
  });

  document.getElementById("who").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-who]");
    if (!b) return;
    me = b.getAttribute("data-who");
    lsSet("school_me", me);
    render();
  });
  document.getElementById("tabAll").addEventListener("click", function () { onlyUnread = false; render(); });
  document.getElementById("tabUnread").addEventListener("click", function () { onlyUnread = true; render(); });
  document.getElementById("reload").addEventListener("click", function (e) { e.preventDefault(); load(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });

  load();
})();
</script>
</body>
</html>
